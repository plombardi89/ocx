version: "2"

linters:
  default: standard
  enable:
    # Bugs and correctness.
    - bodyclose
    - canonicalheader
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - makezero
    - nilerr
    - nilnil
    - noctx
    - recvcheck
    - usetesting
    - wastedassign
    # Style and clarity.
    - dupword
    - errname
    - exptostd
    - gocritic
    - intrange
    - mirror
    - misspell
    - modernize
    - nolintlint
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      # Writes to the terminal have nowhere better to report a failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      # A switch with a default case already handles every other value.
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    # Eval fixtures and scenarios are their own module, with code written
    # the way each scenario needs it, including code that doesn't compile.
    paths:
      - ^evals/
  settings:
    goimports:
      local-prefixes:
        - github.com/plombardi89/ocx
