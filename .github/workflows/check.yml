name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint, at the version pinned in the Makefile.
      - name: Cache lint tools
        uses: actions/cache@v6
        with:
          path: bin
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - run: make check-offline
