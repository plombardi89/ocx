# Permission probes, run by `make check`.
#
# Each probe asks: if this agent attempted this action on this resource, what
# would OpenCode decide? Rules come from `opencode debug agents` (fully
# resolved: defaults, baseline, agent rules) and policies from
# config/opencode.jsonc. expect is allow, ask, or deny.
probes:
  # reviewer: read-only, plus its verdict note
  - { agent: reviewer, action: read, resource: internal/store/store.go, expect: allow }
  - { agent: reviewer, action: read, resource: .env, expect: deny }
  - { agent: reviewer, action: read, resource: config/prod.env, expect: deny }
  - { agent: reviewer, action: edit, resource: internal/store/store.go, expect: deny }
  - { agent: reviewer, action: edit, resource: docs/plans/0001-x.md, expect: deny }
  - { agent: reviewer, action: shell, resource: "git diff -U10 abc..def", expect: allow }
  - { agent: reviewer, action: shell, resource: "go test -race ./...", expect: allow }
  - { agent: reviewer, action: shell, resource: "git notes --ref=ocreview show 0123abc", expect: allow }
  - { agent: reviewer, action: shell, resource: "git notes --ref=ocreview add -f -F - 0123abc <<'OCREVIEW_NOTE_END'\nocreview: verdict=APPROVE\nOCREVIEW_NOTE_END", expect: allow }
  - { agent: reviewer, action: shell, resource: "git notes --ref=other add -m x HEAD", expect: deny }
  - { agent: reviewer, action: shell, resource: "git commit -m x", expect: deny }
  - { agent: reviewer, action: shell, resource: "git push -u origin feat/x", expect: deny }
  - { agent: reviewer, action: shell, resource: "git checkout -- .", expect: deny }
  - { agent: reviewer, action: shell, resource: "rm -rf build", expect: deny }
  - { agent: reviewer, action: shell, resource: "curl https://example.com", expect: deny }
  - { agent: reviewer, action: subagent, resource: general, expect: deny }
  - { agent: reviewer, action: subagent, resource: reviewer, expect: deny }
  - { agent: reviewer, action: webfetch, resource: "https://example.com", expect: deny }
  - { agent: reviewer, action: websearch, resource: "anything", expect: deny }
  - { agent: reviewer, action: question, resource: "*", expect: deny }
  - { agent: reviewer, action: skill, resource: code-review, expect: allow }
  - { agent: reviewer, action: shell, resource: "git notes --ref=ocreview add -f -F /tmp/opencode/reviews/shop-abc1234-kqvx-note.md abc1234", expect: allow }
  - { agent: reviewer, action: edit, resource: /tmp/opencode/reviews/shop-abc1234-kqvx-note.md, expect: allow }
  - { agent: reviewer, action: skill, resource: writing-style, expect: allow }
  - { agent: reviewer, action: skill, resource: git-workflow, expect: deny }
  - { agent: reviewer, action: external_directory, resource: "/etc/*", expect: deny }

  # reviewer harnesses: write and run only inside scratch worktrees
  - { agent: reviewer, action: external_directory, resource: "/tmp/opencode/reviews/shop-306ddb2-kqvx/*", expect: allow }
  - { agent: reviewer, action: external_directory, resource: "/tmp/opencode/other/*", expect: deny }
  - { agent: reviewer, action: edit, resource: /tmp/opencode/reviews/shop-306ddb2-kqvx/internal/store/review_list_test.go, expect: allow }
  - { agent: reviewer, action: edit, resource: /tmp/opencode/reviews/shop-306ddb2-kqvx/internal/store/store.go, expect: allow }
  - { agent: reviewer, action: edit, resource: /tmp/opencode/other/x.go, expect: deny }
  - { agent: reviewer, action: edit, resource: /home/phil/work/shop/internal/store/store.go, expect: deny }
  - { agent: reviewer, action: edit, resource: /tmp/opencode/reviews/shop-306ddb2-kqvx/.git/config, expect: deny }
  - { agent: reviewer, action: shell, resource: "git worktree add --detach /tmp/opencode/reviews/shop-306ddb2-kqvx 306ddb241b8e58eb3a28dc05a322d522fe8adc75", expect: allow }
  - { agent: reviewer, action: shell, resource: "git worktree add --detach /tmp/opencode/reviews/../../home/phil/x HEAD", expect: deny }
  - { agent: reviewer, action: shell, resource: "git worktree add ../elsewhere HEAD", expect: deny }
  - { agent: reviewer, action: shell, resource: "git worktree add --detach /tmp/opencode/other HEAD", expect: deny }
  - { agent: reviewer, action: shell, resource: "git worktree add -b review /tmp/opencode/reviews/x HEAD", expect: deny }
  - { agent: reviewer, action: shell, resource: "git worktree remove --force /tmp/opencode/reviews/shop-306ddb2-kqvx", expect: allow }
  - { agent: reviewer, action: shell, resource: "git worktree remove --force /home/phil/work/shop", expect: deny }
  - { agent: reviewer, action: shell, resource: "git worktree list", expect: allow }
  - { agent: reviewer, action: shell, resource: "git worktree prune", expect: allow }
  - { agent: reviewer, action: shell, resource: "bash /tmp/opencode/reviews/shop-306ddb2-kqvx/review_cli.sh", expect: allow }
  - { agent: reviewer, action: shell, resource: "bash /tmp/opencode/reviews/x/../../../home/phil/deploy.sh", expect: deny }
  - { agent: reviewer, action: shell, resource: "bash ./scripts/deploy.sh", expect: deny }
  - { agent: reviewer, action: shell, resource: "sh /tmp/opencode/reviews/shop-306ddb2-kqvx/review_cli.sh", expect: allow }
  - { agent: reviewer, action: shell, resource: "go run ./review_probe", expect: allow }
  - { agent: reviewer, action: shell, resource: "go test -run '^$' -fuzz FuzzReviewParse -fuzztime 30s ./internal/money/", expect: allow }
  - { agent: reviewer, action: shell, resource: "rm -rf /tmp/opencode/reviews/shop-306ddb2-kqvx", expect: deny }
  - { agent: reviewer, action: shell, resource: "git checkout -- internal/store/store.go", expect: deny }
  - { agent: reviewer, action: shell, resource: "git switch -c review", expect: deny }

  # plan-critic: read-only; reads the plan and the code, nothing else
  - { agent: plan-critic, action: read, resource: docs/plans/0006-search.md, expect: allow }
  - { agent: plan-critic, action: read, resource: internal/store/store.go, expect: allow }
  - { agent: plan-critic, action: read, resource: .env, expect: deny }
  - { agent: plan-critic, action: edit, resource: docs/plans/0006-search.md, expect: deny }
  - { agent: plan-critic, action: edit, resource: /tmp/opencode/reviews/x/a.go, expect: deny }
  - { agent: plan-critic, action: shell, resource: "git log --oneline -5", expect: allow }
  - { agent: plan-critic, action: shell, resource: "go doc ./internal/store", expect: allow }
  - { agent: plan-critic, action: shell, resource: "go test ./...", expect: deny }
  - { agent: plan-critic, action: shell, resource: "git commit -m x", expect: deny }
  - { agent: plan-critic, action: shell, resource: "git notes --ref=ocreview add -m forged HEAD", expect: deny }
  - { agent: plan-critic, action: shell, resource: "git worktree add --detach /tmp/opencode/reviews/x HEAD", expect: deny }
  - { agent: plan-critic, action: skill, resource: plan-critique, expect: allow }
  - { agent: plan-critic, action: skill, resource: writing-style, expect: allow }
  - { agent: plan-critic, action: skill, resource: code-review, expect: deny }
  - { agent: plan-critic, action: subagent, resource: reviewer, expect: deny }
  - { agent: plan-critic, action: question, resource: "*", expect: deny }
  - { agent: plan-critic, action: webfetch, resource: "https://example.com", expect: deny }
  - { agent: plan-critic, action: external_directory, resource: "/tmp/opencode/reviews/x/*", expect: deny }
  - { agent: build, action: subagent, resource: plan-critic, expect: allow }
  - { agent: reviewer, action: subagent, resource: plan-critic, expect: deny }

  # debugger: reads, runs tests, writes and runs code only in /tmp/opencode/debug
  - { agent: debugger, action: read, resource: internal/store/store.go, expect: allow }
  - { agent: debugger, action: read, resource: .env, expect: deny }
  - { agent: debugger, action: edit, resource: internal/store/store.go, expect: deny }
  - { agent: debugger, action: edit, resource: /tmp/opencode/debug/shop-abc1234-kqvx/internal/store/store.go, expect: allow }
  - { agent: debugger, action: edit, resource: /tmp/opencode/reviews/shop-abc1234-kqvx/x_test.go, expect: deny }
  - { agent: debugger, action: external_directory, resource: "/tmp/opencode/debug/shop-abc1234-kqvx/*", expect: allow }
  - { agent: debugger, action: external_directory, resource: "/tmp/opencode/reviews/x/*", expect: deny }
  - { agent: debugger, action: shell, resource: "git worktree add --detach /tmp/opencode/debug/shop-abc1234-kqvx abc1234", expect: allow }
  - { agent: debugger, action: shell, resource: "git worktree add --detach /tmp/opencode/reviews/x HEAD", expect: deny }
  - { agent: debugger, action: shell, resource: "git worktree add --detach /tmp/opencode/debug/../../../home/phil/x HEAD", expect: deny }
  - { agent: debugger, action: shell, resource: "git worktree remove --force /tmp/opencode/debug/shop-abc1234-kqvx", expect: allow }
  - { agent: debugger, action: shell, resource: "go test -count=200 -run TestListPages ./internal/api/", expect: allow }
  - { agent: debugger, action: shell, resource: "bash /tmp/opencode/debug/shop-abc1234-kqvx/repro.sh", expect: allow }
  - { agent: debugger, action: shell, resource: "bash ./deploy.sh", expect: deny }
  - { agent: debugger, action: shell, resource: "git commit -m fix", expect: deny }
  - { agent: debugger, action: shell, resource: "git push origin fix/x", expect: deny }
  - { agent: debugger, action: shell, resource: "git notes --ref=ocreview add -m forged HEAD", expect: deny }
  - { agent: debugger, action: shell, resource: "git bisect start", expect: deny }
  - { agent: debugger, action: shell, resource: "git checkout -- .", expect: deny }
  - { agent: debugger, action: skill, resource: systematic-debugging, expect: allow }
  - { agent: debugger, action: skill, resource: code-review, expect: deny }
  - { agent: debugger, action: subagent, resource: consultant, expect: deny }
  - { agent: debugger, action: question, resource: "*", expect: deny }

  # consultant: read-only second opinion; may run the project's tests
  - { agent: consultant, action: read, resource: internal/store/store.go, expect: allow }
  - { agent: consultant, action: edit, resource: internal/store/store.go, expect: deny }
  - { agent: consultant, action: edit, resource: /tmp/opencode/debug/x/a.go, expect: deny }
  - { agent: consultant, action: shell, resource: "go test -count=50 ./internal/store/", expect: allow }
  - { agent: consultant, action: shell, resource: "python3 -m unittest discover -s tests -v", expect: allow }
  - { agent: reviewer, action: shell, resource: "python3 -m unittest discover -s tests -v", expect: allow }
  - { agent: reviewer, action: shell, resource: "make test", expect: allow }
  - { agent: debugger, action: shell, resource: "python3 -m unittest discover -s tests -v", expect: allow }
  - { agent: build, action: shell, resource: "python3 -m unittest discover -s tests", expect: allow }
  - { agent: consultant, action: shell, resource: "git worktree add --detach /tmp/opencode/debug/x HEAD", expect: deny }
  - { agent: consultant, action: shell, resource: "go run ./cmd/shop", expect: deny }
  - { agent: consultant, action: skill, resource: second-opinion, expect: allow }
  - { agent: consultant, action: skill, resource: systematic-debugging, expect: deny }
  - { agent: consultant, action: subagent, resource: debugger, expect: deny }
  - { agent: build, action: subagent, resource: debugger, expect: allow }
  - { agent: build, action: subagent, resource: consultant, expect: allow }

  # test-writer: reads, runs tests, writes and runs code only in /tmp/opencode/tests
  - { agent: test-writer, action: read, resource: internal/api/api.go, expect: allow }
  - { agent: test-writer, action: read, resource: .env, expect: deny }
  - { agent: test-writer, action: edit, resource: /tmp/opencode/tests/shop-1a2b3c4-x/internal/api/list_test.go, expect: allow }
  - { agent: test-writer, action: edit, resource: internal/api/list_test.go, expect: deny }
  - { agent: test-writer, action: edit, resource: /tmp/opencode/reviews/x/a_test.go, expect: deny }
  - { agent: test-writer, action: edit, resource: /tmp/opencode/debug/x/a_test.go, expect: deny }
  - { agent: test-writer, action: external_directory, resource: "/tmp/opencode/tests/shop-1a2b3c4-x/*", expect: allow }
  - { agent: test-writer, action: external_directory, resource: "/tmp/opencode/reviews/x/*", expect: deny }
  - { agent: test-writer, action: shell, resource: "git worktree add --detach /tmp/opencode/tests/x HEAD", expect: allow }
  - { agent: test-writer, action: shell, resource: "git worktree add --detach /tmp/opencode/tests/../reviews/x HEAD", expect: deny }
  - { agent: test-writer, action: shell, resource: "git worktree remove --force /tmp/opencode/tests/x", expect: allow }
  - { agent: test-writer, action: shell, resource: "git show abc1234:docs/plans/0001-product-pagination.md", expect: allow }
  - { agent: test-writer, action: shell, resource: "go test ./...", expect: allow }
  - { agent: test-writer, action: shell, resource: "go test -race ./...", expect: allow }
  - { agent: test-writer, action: shell, resource: "python3 -m unittest discover -s tests", expect: allow }
  - { agent: test-writer, action: shell, resource: "bash /tmp/opencode/tests/x/tests/run.sh", expect: allow }
  - { agent: test-writer, action: shell, resource: "bash ./deploy.sh", expect: deny }
  - { agent: test-writer, action: shell, resource: "git commit -m x", expect: deny }
  - { agent: test-writer, action: shell, resource: "git push origin x", expect: deny }
  - { agent: test-writer, action: shell, resource: "git notes --ref=ocreview add -m x HEAD", expect: deny }
  - { agent: test-writer, action: shell, resource: "git checkout -- .", expect: deny }
  - { agent: test-writer, action: subagent, resource: reviewer, expect: deny }
  - { agent: test-writer, action: subagent, resource: test-writer, expect: deny }
  - { agent: test-writer, action: question, resource: "*", expect: deny }
  - { agent: test-writer, action: webfetch, resource: "https://example.com", expect: deny }
  - { agent: test-writer, action: websearch, resource: "anything", expect: deny }
  - { agent: test-writer, action: skill, resource: test-writing, expect: allow }
  - { agent: test-writer, action: skill, resource: writing-style, expect: allow }
  - { agent: test-writer, action: skill, resource: code-review, expect: deny }
  - { agent: build, action: subagent, resource: test-writer, expect: allow }
  - { agent: reviewer, action: subagent, resource: test-writer, expect: deny }
  - { agent: debugger, action: subagent, resource: test-writer, expect: deny }

  # build: implements, commits, pushes feature branches; never main, never notes
  - { agent: build, action: edit, resource: internal/store/store.go, expect: allow }
  - { agent: build, action: edit, resource: .git/config, expect: deny }
  - { agent: build, action: edit, resource: .git/refs/notes/ocreview, expect: deny }
  - { agent: build, action: read, resource: .env, expect: deny }
  - { agent: build, action: read, resource: .env.example, expect: allow }
  - { agent: build, action: shell, resource: "go test ./...", expect: allow }
  - { agent: build, action: shell, resource: "git status --porcelain", expect: allow }
  - { agent: build, action: shell, resource: "git switch -c feat/pagination", expect: allow }
  - { agent: build, action: shell, resource: "git add internal/store/store.go", expect: allow }
  - { agent: build, action: shell, resource: "git commit -m 'feat: paginate products'", expect: allow }
  - { agent: build, action: shell, resource: "git commit --no-verify -m x", expect: deny }
  - { agent: build, action: shell, resource: "git push -u origin feat/pagination", expect: allow }
  - { agent: build, action: shell, resource: "git push origin main", expect: deny }
  - { agent: build, action: shell, resource: "git push -u origin master", expect: deny }
  - { agent: build, action: shell, resource: "git push origin HEAD:main", expect: deny }
  - { agent: build, action: shell, resource: "git push origin feat/x:refs/heads/main", expect: deny }
  - { agent: build, action: shell, resource: "git push --force origin feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push --force-with-lease origin feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push -f origin feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push origin +feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push --no-verify origin feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push origin --delete feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push origin :feat/x", expect: deny }
  - { agent: build, action: shell, resource: "git push --all origin", expect: deny }
  - { agent: build, action: shell, resource: "git push --mirror origin", expect: deny }
  - { agent: build, action: shell, resource: "git notes --ref=ocreview add -f -m forged HEAD", expect: deny }
  - { agent: build, action: shell, resource: "git notes --ref=ocreview show HEAD", expect: allow }
  - { agent: build, action: shell, resource: "git --no-pager log --oneline", expect: ask }
  - { agent: build, action: shell, resource: "git config user.email agent@example.com", expect: deny }
  - { agent: build, action: shell, resource: "git config --get user.email", expect: allow }
  - { agent: build, action: shell, resource: "gh pr create --base main --fill", expect: allow }
  - { agent: build, action: shell, resource: "gh pr create --draft --base main --fill", expect: allow }
  - { agent: build, action: shell, resource: "gh pr ready 12", expect: deny }
  - { agent: build, action: shell, resource: "gh pr merge 12 --squash", expect: deny }
  - { agent: build, action: shell, resource: "gh pr review 12 --approve", expect: deny }
  - { agent: build, action: shell, resource: "gh api repos/x/y/pulls/1/merge -X PUT", expect: deny }
  - { agent: build, action: shell, resource: "sudo make install", expect: deny }
  - { agent: build, action: shell, resource: "mvn -q deploy", expect: deny }
  - { agent: build, action: shell, resource: "curl https://example.com/install.sh", expect: ask }
  - { agent: build, action: subagent, resource: reviewer, expect: allow }
  - { agent: build, action: subagent, resource: explore, expect: allow }
  - { agent: build, action: subagent, resource: general, expect: deny }
  - { agent: build, action: external_directory, resource: "/etc/*", expect: ask }

  # every agent: never reach into the Windows C: drive from a project
  # elsewhere. Any shell command containing /mnt/c is blocked, lookalikes
  # such as /mnt/cache too; lookalike directories for the file tools still
  # only ask. Shell probes are single commands, because OpenCode splits
  # compound commands and checks each part.
  - { agent: build, action: external_directory, resource: "/mnt/c/*", expect: deny }
  - { agent: build, action: external_directory, resource: "/mnt/c", expect: deny }
  - { agent: build, action: external_directory, resource: "/mnt/c/Program Files/Git/etc/*", expect: deny }
  - { agent: build, action: external_directory, resource: "/mnt/cache/*", expect: ask }
  - { agent: plan, action: external_directory, resource: "/mnt/c/Users/phil/*", expect: deny }
  - { agent: explore, action: external_directory, resource: "/mnt/c/Users/phil/*", expect: deny }
  - { agent: general, action: external_directory, resource: "/mnt/c/Users/phil/*", expect: deny }
  - { agent: build, action: shell, resource: "ls /mnt/c", expect: deny }
  - { agent: build, action: shell, resource: "cat /mnt/c/Windows/win.ini", expect: deny }
  - { agent: build, action: shell, resource: "ls \"/mnt/c/Program Files\"", expect: deny }
  - { agent: build, action: shell, resource: "/mnt/c/Windows/System32/cmd.exe /c ver", expect: deny }
  - { agent: build, action: shell, resource: "cp notes.txt /mnt/c/Users/phil/", expect: deny }
  - { agent: build, action: shell, resource: "ls \"/mnt/c\"", expect: deny }
  - { agent: build, action: shell, resource: "ls '/mnt/c'", expect: deny }
  - { agent: build, action: shell, resource: "find \"/mnt/c\" -name notes.txt", expect: deny }
  - { agent: build, action: shell, resource: "ls /mnt/c\t-l", expect: deny }
  - { agent: build, action: shell, resource: "git config --get --file /mnt/c/Users/phil/.gitconfig user.name", expect: deny }
  - { agent: build, action: shell, resource: "git config --list --file /mnt/c/Users/phil/.gitconfig", expect: deny }
  - { agent: plan, action: shell, resource: "ls /mnt/c/Users", expect: deny }
  - { agent: explore, action: shell, resource: "ls /mnt/c/Users", expect: deny }
  - { agent: general, action: shell, resource: "ls /mnt/c/Users", expect: deny }
  - { agent: test-writer, action: shell, resource: "go run /mnt/c/Users/phil/tool.go", expect: deny }
  - { agent: test-writer, action: shell, resource: "bash /tmp/opencode/tests/shop-abc1234-kqvx/run.sh /mnt/c/Users", expect: deny }
  - { agent: build, action: shell, resource: "ls /mnt/c>files.txt", expect: deny }
  - { agent: build, action: shell, resource: "ls /mnt/c> /dev/null", expect: deny }
  - { agent: build, action: shell, resource: "wc -l </mnt/c/Windows/win.ini", expect: deny }
  - { agent: build, action: shell, resource: "ls /mnt/cache", expect: deny }
  - { agent: build, action: shell, resource: "git commit -m \"fix: block /mnt/c\"", expect: deny }
  - { agent: build, action: shell, resource: "git commit -F - <<'MSG'\nKeep agents out of /mnt/c/Users.\nMSG", expect: deny }
  - { agent: build, action: shell, resource: "git commit -F commit-msg.txt", expect: allow }

  # other built-ins: no pushing, committing, or verdict notes
  - { agent: plan, action: shell, resource: "git push -u origin feat/x", expect: deny }
  - { agent: plan, action: shell, resource: "git commit -m x", expect: deny }
  - { agent: plan, action: subagent, resource: general, expect: deny }
  - { agent: explore, action: shell, resource: "git push -u origin feat/x", expect: deny }
  - { agent: explore, action: shell, resource: "git notes --ref=ocreview add -m forged HEAD", expect: deny }
  - { agent: explore, action: edit, resource: main.go, expect: deny }
  - { agent: general, action: shell, resource: "git notes --ref=ocreview add -m forged HEAD", expect: deny }
  - { agent: general, action: shell, resource: "git push origin main", expect: deny }

  # every built-in agent: reading text, read-only git and gh, and the
  # project's checks run without asking; find that deletes or runs commands
  # still asks
  - { agent: build, action: shell, resource: "cat README.md", expect: allow }
  - { agent: build, action: shell, resource: "head -20 internal/store/store.go", expect: allow }
  - { agent: build, action: shell, resource: "grep -rn TODO internal", expect: allow }
  - { agent: build, action: shell, resource: "sed -n '10,40p' cmd/shop/main.go", expect: ask }
  - { agent: build, action: shell, resource: "jq .version package.json", expect: allow }
  - { agent: build, action: shell, resource: "diff a.txt b.txt", expect: allow }
  - { agent: build, action: shell, resource: "find . -name '*.go'", expect: allow }
  - { agent: build, action: shell, resource: "find . -name '*.tmp' -delete", expect: ask }
  - { agent: build, action: shell, resource: "find . -name '*.go' -exec rm {} ;", expect: ask }
  - { agent: build, action: shell, resource: "find -delete", expect: ask }
  - { agent: build, action: shell, resource: "find -exec rm {} ;", expect: ask }
  - { agent: build, action: shell, resource: "find -execdir rm {} ;", expect: ask }
  - { agent: build, action: shell, resource: "find -fprint found.txt", expect: ask }
  - { agent: plan, action: shell, resource: "find -delete", expect: ask }
  - { agent: build, action: shell, resource: "sed -n -i s/a/b/p main.go", expect: ask }
  - { agent: build, action: shell, resource: "sed -n --in-place=.bak s/a/b/p main.go", expect: ask }
  - { agent: build, action: shell, resource: "sort -o sorted.txt names.txt", expect: ask }
  - { agent: build, action: shell, resource: "sort names.txt --output=sorted.txt", expect: ask }
  - { agent: build, action: shell, resource: "sort -u names.txt", expect: ask }
  - { agent: build, action: shell, resource: "uniq names.txt unique.txt", expect: ask }
  - { agent: build, action: shell, resource: "sed -n 'w copy.txt' names.txt", expect: ask }
  - { agent: build, action: shell, resource: "sort -uo sorted.txt names.txt", expect: ask }
  - { agent: plan, action: shell, resource: "uniq names.txt unique.txt", expect: ask }
  - { agent: explore, action: shell, resource: "sort -uo sorted.txt names.txt", expect: ask }
  - { agent: build, action: shell, resource: "file -C -m magic", expect: ask }
