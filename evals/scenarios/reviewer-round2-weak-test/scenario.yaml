name: reviewer-round2-weak-test
description: Round 2 after the pagination review. Both findings are fixed and "regression tests" were added, but they pass on the round-1 commit too; the reviewer must catch that by running them there.
fixture: go-service
tags: [reviewer, round2]
agent: reviewer
bakeoff: true
branch: feat/product-pagination
commits:
  - message: "feat: paginate the product list"
    overlay: ../reviewer-planted-bug/overlay
    note: ../_shared/pagination-round1-note.md
  - message: "fix: handle offsets past the end and cap the page size"
    overlays: [../_shared/pagination-fix, tests]
prompt: |
  Review request
  Repository: {{.Repo}}
  Branch: {{.Branch}}
  Base: {{.Base}}
  Head: {{.Head}}
  Plan: docs/plans/0001-product-pagination.md
  Round: 2
  Previous review: {{index .Commits 0}}
expect:
  verdict: REQUEST_CHANGES
  mentions:
    - "(?i)regression test"
    - "(?i)(passes on [0-9a-f]{7}|pass(es|ed)? (on|against) (the )?(previous|prior|old|round[- ]1|pre-fix|unfixed))"
  executed_evidence: true
  note: true
  unchanged: true
  skill_loaded: code-review
  edits_in_scratch_only: true
