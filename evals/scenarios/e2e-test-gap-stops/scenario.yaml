name: e2e-test-gap-stops
description: A stubbed test-writer returns a report with a GAP for the split plan's vague criterion. Build brings the gap to Phil, launches no reviewer, and pushes nothing.
fixture: go-service
tags: [tests, e2e]
agent: build
timeout: 45m
branch: feat/split-amounts
commits:
  - message: "feat: split an amount into equal parts"
    overlays: [../reviewer-clean-change/overlay, ../test-writer-vague-plan/overlay]
stub_agents:
  test-writer: [../_shared/stub-reports/split-gap.md]
prompt: |
  Get independent tests for the plan docs/plans/0002-split-amounts.md by following the `requesting-tests` skill. First check that every task in the plan is implemented and committed on the current branch, and that the project's tests pass. When every adopted test passes and nothing is waiting for Phil, follow the `requesting-review` skill, and push the branch once it's approved.

  This is a non-interactive run: don't ask questions; if you get blocked, explain why and stop.
expect:
  mentions:
    - "(?i)\\bgap"
    - "(?i)(fast|speed|1 ms|large n)"
    - "(?i)(Phil|decide|decision|your call)"
  e2e:
    no_push: true
    remote_main_unchanged: true
    dispatches:
      - agent: test-writer
        prefix: Test request
        min: 1
        max: 1
        forbid:
          - "(?i)tests? (all )?(pass|passed|passing|are green|is green)"
          - "(?i)already (verified|checked|tested|reviewed)"
          - "(?i)\\b(just|only) (check|look|focus|test|review)"
          - "(?i)(trivial|simple|small|tiny) (change|fix)"
          - "(?i)\\b(focus on|edge cases?|make sure)\\b"
      - agent: reviewer
        max: 0
