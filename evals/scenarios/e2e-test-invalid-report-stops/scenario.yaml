name: e2e-test-invalid-report-stops
description: A stubbed test-writer returns a COMPLETE report for the seven-criterion pagination plan that lists only six criteria. Build requests one new run, gets the same report, and brings both to Phil without launching the reviewer or pushing.
fixture: go-service
tags: [tests, e2e]
agent: build
timeout: 45m
branch: feat/product-pagination
commits:
  - message: "feat: paginate the product list"
    overlays: [../reviewer-planted-bug/overlay, ../_shared/pagination-fix]
stub_agents:
  test-writer: [../_shared/stub-reports/pagination-six-criteria.md]
prompt: |
  Get independent tests for the plan docs/plans/0001-product-pagination.md by following the `requesting-tests` skill. First check that every task in the plan is implemented and committed on the current branch, and that the project's tests pass. When every adopted test passes and nothing is waiting for Phil, follow the `requesting-review` skill, and push the branch once it's approved.

  This is a non-interactive run: don't ask questions; if you get blocked, explain why and stop.
expect:
  mentions:
    - "(?i)(criterion 5|5\\b.*(missing|not listed|skipped|omitted)|(missing|not listed|skipped|omitted|lists only).*(5|six|6))"
    - "Phil"
  e2e:
    no_push: true
    remote_main_unchanged: true
    dispatches:
      - agent: test-writer
        prefix: Test request
        min: 2
        max: 2
        forbid:
          - "(?i)tests? (all )?(pass|passed|passing|are green|is green)"
          - "(?i)already (verified|checked|tested|reviewed)"
          - "(?i)\\b(just|only) (check|look|focus|test|review)"
          - "(?i)(trivial|simple|small|tiny) (change|fix)"
          - "(?i)\\b(focus on|edge cases?|make sure)\\b"
      - agent: reviewer
        max: 0
